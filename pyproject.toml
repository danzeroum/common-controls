[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "common-controls"
version = "0.1.0"
description = "Catálogo versionado de controles técnicos reutilizáveis para o ecossistema de assurance danzeroum."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ci*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["ci", "tests", "."]
