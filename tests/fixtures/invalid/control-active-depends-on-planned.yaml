# Fixture INVÁLIDA — controle ativo (lifecycle=active) depende de assertion planejada.
# O validador de compatibilidade deve detectar ACTIVE-CONTROL-DEPENDS-ON-PLANNED.
control:
  id: CTRL-DEP-002
  title: Controle ativo que depende de assertion planejada
  purpose: >-
    Controle declarado como active mas exige assertion que ainda não é emitida
    pela suíte. Deve falhar: controle ativo não pode depender de planned.
  lifecycle: active
  required_evidence:
    all_of:
      - source: pse-suite
        assertion: PSE-DEP-INVENTORY-MATCH
        expected_status: passed
        freshness_days: 7
  evaluation:
    missing_evidence: not_satisfied
    errored_evidence: not_satisfied
    expired_evidence: not_satisfied
    skipped_evidence: not_satisfied
    not_assessed_evidence: not_satisfied
  exceptions:
    allowed: false
