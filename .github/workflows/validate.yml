name: Validate common-controls

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Catalog, compatibility and delivery validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Prepare reports directory and metadata
        run: |
          mkdir -p reports
          PYTHON_VERSION=$(python --version 2>&1)
          PIP_VERSION=$(pip --version 2>&1)
          cat > reports/metadata.json <<EOF
          {
            "event_name": "${{ github.event_name }}",
            "repository": "${{ github.repository }}",
            "ref": "${{ github.ref }}",
            "github_sha": "${{ github.sha }}",
            "head_sha": "${{ github.event.pull_request.head.sha || '' }}",
            "base_sha": "${{ github.event.pull_request.base.sha || '' }}",
            "github_run_id": "${{ github.run_id }}",
            "github_run_attempt": "${{ github.run_attempt }}",
            "python_version": "$PYTHON_VERSION",
            "pip_version": "$PIP_VERSION",
            "timestamp_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Run test suite
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          set +e

          python -m pytest -q --junitxml=reports/junit.xml 2>&1 | tee reports/pytest.log
          code=${PIPESTATUS[0]}

          printf '%s\n' "$code" > reports/pytest.exitcode
          exit "$code"

      - name: Validate catalog
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          set +e

          python ci/validate_catalog.py 2>&1 | tee reports/validate_catalog.log
          code=${PIPESTATUS[0]}

          printf '%s\n' "$code" > reports/validate_catalog.exitcode
          exit "$code"

      - name: Validate suite compatibility
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          set +e

          python ci/validate_suite_compatibility.py 2>&1 | tee reports/validate_suite_compatibility.log
          code=${PIPESTATUS[0]}

          printf '%s\n' "$code" > reports/validate_suite_compatibility.exitcode
          exit "$code"

      - name: Validate evidence contract draft
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          set +e

          python ci/validate_evidence_contract_draft.py --quiet 2>&1 | tee reports/validate_evidence_contract_draft.log
          code=${PIPESTATUS[0]}

          printf '%s\n' "$code" > reports/validate_evidence_contract_draft.exitcode
          exit "$code"

      - name: Verify release manifest
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          set +e

          python ci/verify_release_manifest.py 2>&1 | tee reports/verify_release_manifest.log
          code=${PIPESTATUS[0]}

          printf '%s\n' "$code" > reports/verify_release_manifest.exitcode
          exit "$code"

      - name: Verify delivery package
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          set +e

          python ci/verify_delivery_package.py 2>&1 | tee reports/verify_delivery_package.log
          code=${PIPESTATUS[0]}

          printf '%s\n' "$code" > reports/verify_delivery_package.exitcode
          exit "$code"

      - name: Run assurance mutations
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          set +e

          python tests/run_catalog_mutations.py 2>&1 | tee reports/run_catalog_mutations.log
          code=${PIPESTATUS[0]}

          printf '%s\n' "$code" > reports/run_catalog_mutations.exitcode
          exit "$code"

      - name: Check derived coverage report
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          set +e

          python ci/generate_control_coverage.py --check 2>&1 | tee reports/generate_control_coverage.log
          code=${PIPESTATUS[0]}

          printf '%s\n' "$code" > reports/generate_control_coverage.exitcode
          exit "$code"

      - name: Generate gate summary
        if: always()
        run: |
          python3 -c "
          import json, glob, os, sys
          summary = {'gates': []}
          overall = 0
          expected_gates = [
              'pytest',
              'validate_catalog',
              'validate_suite_compatibility',
              'validate_evidence_contract_draft',
              'verify_release_manifest',
              'verify_delivery_package',
              'run_catalog_mutations',
              'generate_control_coverage',
          ]
          found_gates = set()
          for f in sorted(glob.glob('reports/*.exitcode')):
              gate = os.path.basename(f).replace('.exitcode', '')
              found_gates.add(gate)
              with open(f) as fp:
                  code = int(fp.read().strip())
              log_file = f.replace('.exitcode', '.log')
              log_content = ''
              if os.path.exists(log_file):
                  with open(log_file) as lf:
                      log_content = lf.read()[-5000:]
              summary['gates'].append({
                  'name': gate,
                  'exit_code': code,
                  'log_tail': log_content
              })
              print(f'DEBUG: Found gate {gate} with exit_code={code}', file=sys.stderr)
              if code != 0:
                  overall = 1
          for gate in expected_gates:
              if gate not in found_gates:
                  summary['gates'].append({
                      'name': gate,
                      'exit_code': -1,
                      'log_tail': 'GATE MISSING: no exitcode file found'
                  })
                  print(f'DEBUG: Gate {gate} MISSING', file=sys.stderr)
                  overall = 1
          summary['overall_exit_code'] = overall
          print(f'DEBUG: overall={overall}, found_gates={found_gates}', file=sys.stderr)
          with open('reports/gate-summary.json', 'w') as sf:
              json.dump(summary, sf, indent=2)
          if overall != 0:
              print('DEBUG: Gate summary failed, exiting with 1', file=sys.stderr)
              exit(1)
          "

      - name: Copy control coverage report to reports
        if: always()
        run: |
          cp docs/generated/control-coverage.md reports/control-coverage.md 2>/dev/null || true

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/**
          retention-days: 30
          if-no-files-found: warn